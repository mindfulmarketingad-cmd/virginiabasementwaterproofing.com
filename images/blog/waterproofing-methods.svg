<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <!-- sky -->
  <rect width="1200" height="250" fill="#eaeffa"/>
  <!-- ground -->
  <rect y="250" width="1200" height="425" fill="#d9c3a6"/>
  <rect y="250" width="1200" height="18" fill="#b89b78"/>
  <!-- house above grade -->
  <rect x="360" y="120" width="480" height="130" fill="#ffffff" stroke="#1b2a6b" stroke-width="3"/>
  <polygon points="340,120 600,40 860,120" fill="#c8102e"/>
  <rect x="470" y="160" width="70" height="90" fill="#2d55b0"/>
  <rect x="660" y="160" width="70" height="90" fill="#2d55b0"/>
  <!-- foundation wall -->
  <rect x="360" y="250" width="480" height="320" fill="#cfd8e6" stroke="#1b2a6b" stroke-width="3"/>
  <text x="600" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#1b2a6b">BASEMENT</text>
  <!-- exterior membrane -->
  <rect x="330" y="250" width="30" height="320" fill="#1f8a4c"/>
  <text x="120" y="330" font-size="22" font-weight="700" fill="#1b2a6b">Exterior</text>
  <text x="120" y="356" font-size="22" font-weight="700" fill="#1b2a6b">membrane</text>
  <text x="120" y="382" font-size="18" fill="#5a6b7b">20–30+ yrs</text>
  <line x1="250" y1="350" x2="328" y2="400" stroke="#1f8a4c" stroke-width="3"/>
  <!-- interior french drain -->
  <rect x="380" y="540" width="440" height="20" fill="#2d55b0"/>
  <circle cx="410" cy="550" r="6" fill="#fff"/>
  <circle cx="460" cy="550" r="6" fill="#fff"/>
  <circle cx="510" cy="550" r="6" fill="#fff"/>
  <circle cx="560" cy="550" r="6" fill="#fff"/>
  <circle cx="610" cy="550" r="6" fill="#fff"/>
  <circle cx="660" cy="550" r="6" fill="#fff"/>
  <circle cx="710" cy="550" r="6" fill="#fff"/>
  <text x="870" y="545" font-size="22" font-weight="700" fill="#1b2a6b">Interior drain</text>
  <text x="870" y="571" font-size="18" fill="#5a6b7b">20–50 yrs</text>
  <!-- sump pump -->
  <rect x="760" y="500" width="70" height="70" fill="#1b2a6b"/>
  <rect x="785" y="430" width="14" height="80" fill="#1b2a6b"/>
  <text x="795" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#c8102e">Sump 7–12 yrs</text>
  <!-- title bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Basement Waterproofing Methods &amp; Where They Work</text>
</svg>
