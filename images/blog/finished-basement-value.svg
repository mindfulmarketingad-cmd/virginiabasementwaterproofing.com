<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Waterproofing Unlocks Finished Square Footage</text>

  <!-- before -->
  <text x="320" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#c8102e">Before: wet &amp; unusable</text>
  <rect x="90" y="140" width="460" height="320" fill="#cfd8e6" stroke="#1b2a6b" stroke-width="3"/>
  <!-- water puddles -->
  <ellipse cx="200" cy="430" rx="70" ry="16" fill="#2d55b0" opacity="0.5"/>
  <ellipse cx="380" cy="440" rx="90" ry="18" fill="#2d55b0" opacity="0.5"/>
  <!-- mold spots -->
  <circle cx="140" cy="200" r="14" fill="#1f8a4c" opacity="0.55"/>
  <circle cx="170" cy="220" r="10" fill="#1f8a4c" opacity="0.55"/>
  <circle cx="500" cy="210" r="12" fill="#1f8a4c" opacity="0.55"/>
  <text x="320" y="300" text-anchor="middle" font-size="20" fill="#5a6b7b">Musty &#183; damp &#183; storage only</text>

  <!-- arrow -->
  <text x="600" y="310" text-anchor="middle" font-size="60" fill="#1f8a4c">&#8594;</text>
  <text x="600" y="350" text-anchor="middle" font-size="15" fill="#5a6b7b">waterproof</text>
  <text x="600" y="370" text-anchor="middle" font-size="15" fill="#5a6b7b">first</text>

  <!-- after -->
  <text x="880" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#1f8a4c">After: finished living space</text>
  <rect x="650" y="140" width="460" height="320" fill="#eaeffa" stroke="#1b2a6b" stroke-width="3"/>
  <!-- sofa -->
  <rect x="690" y="360" width="150" height="60" rx="8" fill="#2d55b0"/>
  <rect x="690" y="330" width="150" height="40" rx="8" fill="#1f3e88"/>
  <!-- rug -->
  <rect x="690" y="430" width="320" height="16" rx="6" fill="#c8102e" opacity="0.6"/>
  <!-- lamp -->
  <rect x="980" y="300" width="10" height="120" fill="#1b2a6b"/>
  <polygon points="960,300 1010,300 1000,260 970,260" fill="#f1c40f" opacity="0.8"/>
  <!-- shelf -->
  <rect x="900" y="200" width="120" height="14" fill="#1b2a6b"/>
  <rect x="900" y="240" width="120" height="14" fill="#1b2a6b"/>
  <text x="880" y="300" text-anchor="middle" font-size="18" fill="#5a6b7b">Recovers 70&#8211;86% of remodel cost</text>

  <!-- footer bar -->
  <rect x="90" y="500" width="1020" height="120" rx="12" fill="#f5f7fc" stroke="#e3e8ee" stroke-width="2"/>
  <text x="600" y="548" text-anchor="middle" font-size="20" font-weight="800" fill="#1b2a6b">A dry basement is the required first step before any finishing project.</text>
  <text x="600" y="585" text-anchor="middle" font-size="17" fill="#5a6b7b">Skipping waterproofing risks ruined drywall, flooring, and framing &#8212; and voided value.</text>
</svg>
