<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">The Parts of a Complete Waterproofing System</text>

  <!-- center label -->
  <circle cx="600" cy="370" r="95" fill="#1b2a6b"/>
  <text x="600" y="360" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">Dry,</text>
  <text x="600" y="388" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">healthy</text>
  <text x="600" y="416" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">basement</text>

  <!-- surrounding component chips -->
  <g font-size="16" font-weight="700">
    <!-- top left -->
    <rect x="110" y="120" width="280" height="60" rx="30" fill="#eaeffa" stroke="#2d55b0" stroke-width="2"/>
    <text x="250" y="157" text-anchor="middle" fill="#1b2a6b">🌊 Interior French drains</text>
    <!-- top center -->
    <rect x="460" y="100" width="280" height="60" rx="30" fill="#eafaf0" stroke="#1f8a4c" stroke-width="2"/>
    <text x="600" y="137" text-anchor="middle" fill="#1b2a6b">🛡️ Exterior membrane</text>
    <!-- top right -->
    <rect x="810" y="120" width="290" height="60" rx="30" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
    <text x="955" y="157" text-anchor="middle" fill="#1b2a6b">🧱 Exterior drain tile</text>
    <!-- mid left -->
    <rect x="80" y="340" width="250" height="60" rx="30" fill="#eaeffa" stroke="#2d55b0" stroke-width="2"/>
    <text x="205" y="377" text-anchor="middle" fill="#1b2a6b">⚡ Sump pump</text>
    <!-- mid right -->
    <rect x="870" y="340" width="250" height="60" rx="30" fill="#eaeffa" stroke="#2d55b0" stroke-width="2"/>
    <text x="995" y="377" text-anchor="middle" fill="#1b2a6b">💧 Dehumidifier</text>
    <!-- bottom left -->
    <rect x="110" y="540" width="280" height="60" rx="30" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
    <text x="250" y="577" text-anchor="middle" fill="#1b2a6b">🩹 Crack injection</text>
    <!-- bottom center -->
    <rect x="460" y="560" width="280" height="60" rx="30" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
    <text x="600" y="597" text-anchor="middle" fill="#1b2a6b">🧴 Masonry coatings</text>
    <!-- bottom right -->
    <rect x="810" y="540" width="290" height="60" rx="30" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
    <text x="955" y="577" text-anchor="middle" fill="#1b2a6b">📃 Vapor barriers</text>
  </g>

  <!-- connector lines -->
  <g stroke="#cdd6e6" stroke-width="2">
    <line x1="300" y1="180" x2="540" y2="320"/>
    <line x1="600" y1="160" x2="600" y2="275"/>
    <line x1="900" y1="180" x2="660" y2="320"/>
    <line x1="280" y1="370" x2="505" y2="370"/>
    <line x1="920" y1="370" x2="695" y2="370"/>
    <line x1="300" y1="540" x2="545" y2="420"/>
    <line x1="600" y1="560" x2="600" y2="465"/>
    <line x1="900" y1="540" x2="660" y2="420"/>
  </g>
</svg>
