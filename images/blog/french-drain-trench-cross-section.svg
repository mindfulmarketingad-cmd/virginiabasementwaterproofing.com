<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="26" font-weight="800" fill="#ffffff">Anatomy of a French Drain Trench</text>

  <!-- ground -->
  <rect x="60" y="120" width="1080" height="480" fill="#e8ddc9"/>
  <rect x="60" y="120" width="1080" height="26" fill="#7a9b5c"/>
  <text x="80" y="105" font-size="16" font-weight="700" fill="#1b2a6b">Grade</text>

  <!-- house wall for reference -->
  <rect x="60" y="146" width="90" height="454" fill="#cfd6e0"/>
  <text x="70" y="330" font-size="16" font-weight="800" fill="#1b2a6b" transform="rotate(-90 70 330)">FOUNDATION WALL</text>

  <!-- trench -->
  <rect x="230" y="240" width="220" height="300" fill="#ffffff" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="228" font-size="15" font-weight="700" fill="#1b2a6b">Trench: ~12&#8221; wide, 18&#8211;24&#8221; deep</text>

  <!-- landscape fabric lining -->
  <rect x="238" y="248" width="204" height="284" fill="none" stroke="#c8a24a" stroke-width="4"/>
  <text x="470" y="270" font-size="14" fill="#8a6d1f" font-weight="700">&#8592; Landscape fabric liner</text>

  <!-- gravel fill -->
  <rect x="242" y="252" width="196" height="270" fill="#d8d2c4"/>
  <circle cx="270" cy="290" r="5" fill="#a8a190"/><circle cx="300" cy="310" r="6" fill="#a8a190"/>
  <circle cx="330" cy="280" r="5" fill="#a8a190"/><circle cx="360" cy="330" r="6" fill="#a8a190"/>
  <circle cx="280" cy="360" r="5" fill="#a8a190"/><circle cx="410" cy="300" r="5" fill="#a8a190"/>
  <circle cx="390" cy="400" r="6" fill="#a8a190"/><circle cx="310" cy="440" r="5" fill="#a8a190"/>
  <circle cx="260" cy="480" r="6" fill="#a8a190"/><circle cx="420" cy="470" r="5" fill="#a8a190"/>
  <text x="470" y="310" font-size="14" fill="#5a6b7b" font-weight="700">&#8592; Clean 3/4&#8221; drainage gravel</text>

  <!-- pipe -->
  <circle cx="340" cy="480" r="34" fill="#2d55b0" stroke="#1b2a6b" stroke-width="3"/>
  <circle cx="340" cy="480" r="20" fill="#eaeffa"/>
  <text x="470" y="486" font-size="14" fill="#1b2a6b" font-weight="700">&#8592; Perforated 4&#8221; pipe, wrapped in a filter sock</text>

  <!-- slope arrow -->
  <path d="M480 500 L 1080 560" stroke="#c8102e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c8102e"/>
    </marker>
  </defs>
  <text x="700" y="590" font-size="15" font-weight="800" fill="#c8102e">Minimum 1/8&#8221; drop per foot, toward discharge</text>

  <!-- discharge -->
  <rect x="1060" y="500" width="70" height="18" fill="#2d55b0"/>
  <text x="1000" y="540" font-size="14" fill="#1b2a6b" font-weight="700">Daylight 10+ ft from the foundation, or to a dry well / sump</text>

  <!-- backfill label -->
  <text x="480" y="230" font-size="14" fill="#5a6b7b">Backfilled soil above the gravel</text>
</svg>
