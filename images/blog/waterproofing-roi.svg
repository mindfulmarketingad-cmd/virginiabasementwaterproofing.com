<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">The Financial Impact of Waterproofing</text>

  <!-- three stat cards -->
  <rect x="50" y="110" width="350" height="490" rx="14" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="225" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a6b">Direct ROI</text>
  <circle cx="225" cy="320" r="110" fill="none" stroke="#e3e8ee" stroke-width="26"/>
  <path d="M225,210 A110,110 0 0,1 320,375" fill="none" stroke="#1f8a4c" stroke-width="26" stroke-linecap="round"/>
  <text x="225" y="330" text-anchor="middle" font-size="60" font-weight="800" fill="#1f8a4c">30%</text>
  <text x="225" y="365" text-anchor="middle" font-size="15" fill="#5a6b7b">project value</text>
  <text x="225" y="500" text-anchor="middle" font-size="16" fill="#5a6b7b">On a $5K&#8211;$10K</text>
  <text x="225" y="524" text-anchor="middle" font-size="16" fill="#5a6b7b">system investment</text>

  <rect x="425" y="110" width="350" height="490" rx="14" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a6b">Finished Basement</text>
  <circle cx="600" cy="320" r="110" fill="none" stroke="#e3e8ee" stroke-width="26"/>
  <path d="M600,210 A110,110 0 1,1 520,408" fill="none" stroke="#2d55b0" stroke-width="26" stroke-linecap="round"/>
  <text x="600" y="320" text-anchor="middle" font-size="48" font-weight="800" fill="#2d55b0">70&#8211;86%</text>
  <text x="600" y="356" text-anchor="middle" font-size="15" fill="#5a6b7b">of remodel cost</text>
  <text x="600" y="500" text-anchor="middle" font-size="16" fill="#5a6b7b">Recovered when</text>
  <text x="600" y="524" text-anchor="middle" font-size="16" fill="#5a6b7b">below-grade space</text>
  <text x="600" y="548" text-anchor="middle" font-size="16" fill="#5a6b7b">is finished</text>

  <rect x="800" y="110" width="350" height="490" rx="14" fill="#1b2a6b"/>
  <text x="975" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Marketability</text>
  <text x="975" y="300" text-anchor="middle" font-size="70">🏠</text>
  <text x="975" y="380" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Avoids a major</text>
  <text x="975" y="410" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">buyer red flag</text>
  <text x="975" y="470" text-anchor="middle" font-size="16" fill="#c5d4e3">A wet, musty basement</text>
  <text x="975" y="494" text-anchor="middle" font-size="16" fill="#c5d4e3">means lower offers</text>
  <text x="975" y="518" text-anchor="middle" font-size="16" fill="#c5d4e3">&amp; failed sales</text>
</svg>
