<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="26" font-weight="800" fill="#ffffff">Why Water Chooses the Gravel Over the Clay</text>

  <!-- soil block -->
  <rect x="60" y="100" width="1080" height="500" fill="#cdbfa0"/>
  <text x="90" y="140" font-size="18" font-weight="700" fill="#5a4a2a">Native soil (clay/loam)</text>

  <!-- clay particles (dense) -->
  <g fill="#a89571">
    <circle cx="150" cy="220" r="10"/><circle cx="190" cy="235" r="9"/><circle cx="230" cy="215" r="10"/>
    <circle cx="150" cy="260" r="9"/><circle cx="190" cy="275" r="10"/><circle cx="230" cy="255" r="9"/>
    <circle cx="150" cy="300" r="10"/><circle cx="190" cy="315" r="9"/><circle cx="230" cy="295" r="10"/>
    <circle cx="270" cy="230" r="9"/><circle cx="270" cy="270" r="10"/><circle cx="270" cy="310" r="9"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-size="15" fill="#5a4a2a" font-weight="700">Tightly packed</text>
  <text x="200" y="380" text-anchor="middle" font-size="15" fill="#5a4a2a" font-weight="700">Water moves slowly</text>

  <!-- trench with gravel -->
  <rect x="450" y="170" width="220" height="360" fill="#ffffff" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="458" y="178" width="204" height="344" fill="#e0dacb"/>
  <g fill="#a8a190">
    <circle cx="490" cy="220" r="16"/><circle cx="540" cy="240" r="18"/><circle cx="590" cy="215" r="15"/>
    <circle cx="480" cy="280" r="17"/><circle cx="530" cy="300" r="16"/><circle cx="600" cy="270" r="18"/>
    <circle cx="500" cy="340" r="16"/><circle cx="560" cy="360" r="17"/><circle cx="610" cy="330" r="15"/>
    <circle cx="490" cy="400" r="18"/><circle cx="550" cy="420" r="16"/><circle cx="600" cy="390" r="17"/>
    <circle cx="510" cy="460" r="16"/><circle cx="580" cy="480" r="18"/>
  </g>
  <circle cx="560" cy="500" r="34" fill="#2d55b0" stroke="#1b2a6b" stroke-width="3"/>
  <circle cx="560" cy="500" r="20" fill="#eaeffa"/>
  <text x="560" y="150" text-anchor="middle" font-size="16" font-weight="800" fill="#1b2a6b">Gravel-filled trench</text>
  <text x="560" y="555" text-anchor="middle" font-size="14" fill="#1b2a6b" font-weight="700">Wide open pore spaces</text>
  <text x="560" y="575" text-anchor="middle" font-size="14" fill="#1b2a6b" font-weight="700">Water moves fast &amp; freely</text>

  <!-- arrows showing water preferring gravel -->
  <path d="M340 250 C 400 250, 420 280, 450 300" stroke="#2d55b0" stroke-width="3" fill="none" marker-end="url(#a1)"/>
  <path d="M340 400 C 400 400, 420 420, 450 430" stroke="#2d55b0" stroke-width="3" fill="none" marker-end="url(#a1)"/>
  <path d="M320 340 C 300 380, 300 420, 310 460" stroke="#a89571" stroke-width="2" fill="none" stroke-dasharray="3 4" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d55b0"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a89571"/>
    </marker>
  </defs>
  <text x="330" y="250" font-size="13" fill="#2d55b0" font-weight="700" text-anchor="end">Water diverts toward gravel &#8594;</text>
  <text x="290" y="500" font-size="12" fill="#5a4a2a" text-anchor="middle">A little still seeps</text>
  <text x="290" y="516" font-size="12" fill="#5a4a2a" text-anchor="middle">through clay slowly</text>

  <!-- slope arrow at bottom -->
  <path d="M700 550 L 1100 590" stroke="#c8102e" stroke-width="3" fill="none" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c8102e"/>
    </marker>
  </defs>
  <text x="900" y="620" text-anchor="middle" font-size="15" font-weight="800" fill="#c8102e">Then gravity carries it downhill through the pipe</text>
</svg>
