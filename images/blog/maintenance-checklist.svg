<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="64" fill="#1b2a6b"/>
  <text x="40" y="42" font-size="28" font-weight="800" fill="#ffffff">Extend Your System: Maintenance Checklist</text>

  <!-- card 1 -->
  <rect x="50" y="110" width="350" height="240" rx="12" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="100" cy="170" r="26" fill="#eaeffa"/>
  <text x="100" y="180" text-anchor="middle" font-size="28">🌧️</text>
  <text x="150" y="166" font-size="22" font-weight="800" fill="#1b2a6b">Clear gutters</text>
  <text x="150" y="196" font-size="17" fill="#5a6b7b">Divert downspouts</text>
  <text x="150" y="220" font-size="17" fill="#5a6b7b">6+ ft from the</text>
  <text x="150" y="244" font-size="17" fill="#5a6b7b">foundation.</text>
  <rect x="76" y="290" width="298" height="34" rx="6" fill="#1f8a4c"/>
  <text x="225" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Reduces water load</text>

  <!-- card 2 -->
  <rect x="425" y="110" width="350" height="240" rx="12" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="475" cy="170" r="26" fill="#eaeffa"/>
  <text x="475" y="180" text-anchor="middle" font-size="28">⛰️</text>
  <text x="525" y="166" font-size="22" font-weight="800" fill="#1b2a6b">Grade the soil</text>
  <text x="525" y="196" font-size="17" fill="#5a6b7b">Slope ground away</text>
  <text x="525" y="220" font-size="17" fill="#5a6b7b">so water never</text>
  <text x="525" y="244" font-size="17" fill="#5a6b7b">pools at the wall.</text>
  <rect x="451" y="290" width="298" height="34" rx="6" fill="#2d55b0"/>
  <text x="600" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Stops pooling</text>

  <!-- card 3 -->
  <rect x="800" y="110" width="350" height="240" rx="12" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="850" cy="170" r="26" fill="#eaeffa"/>
  <text x="850" y="180" text-anchor="middle" font-size="28">⚡</text>
  <text x="900" y="166" font-size="22" font-weight="800" fill="#1b2a6b">Test the pump</text>
  <text x="900" y="196" font-size="17" fill="#5a6b7b">Check yearly before</text>
  <text x="900" y="220" font-size="17" fill="#5a6b7b">spring rains; clear</text>
  <text x="900" y="244" font-size="17" fill="#5a6b7b">discharge lines.</text>
  <rect x="826" y="290" width="298" height="34" rx="6" fill="#c8102e"/>
  <text x="975" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Prevents failure</text>

  <!-- card 4 full width -->
  <rect x="50" y="380" width="1100" height="240" rx="12" fill="#1b2a6b"/>
  <circle cx="120" cy="450" r="32" fill="#2d55b0"/>
  <text x="120" y="462" text-anchor="middle" font-size="34">🧹</text>
  <text x="185" y="445" font-size="26" font-weight="800" fill="#ffffff">Keep drains clean</text>
  <text x="185" y="482" font-size="19" fill="#c5d4e3">Periodically flush interior and exterior French drains to clear silt, dirt,</text>
  <text x="185" y="510" font-size="19" fill="#c5d4e3">and roots before they cause a clog.</text>
  <text x="185" y="560" font-size="17" font-weight="700" fill="#ffffff">Annual upkeep can add years &#8212; even decades &#8212; to your waterproofing.</text>
</svg>
