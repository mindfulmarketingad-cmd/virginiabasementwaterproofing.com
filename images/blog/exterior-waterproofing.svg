<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#eaeffa"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Exterior Waterproofing &#8212; Stopping Water at the Source</text>
  <!-- soil -->
  <rect y="200" width="1200" height="475" fill="#d9c3a6"/>
  <!-- house -->
  <rect x="640" y="120" width="420" height="100" fill="#ffffff" stroke="#1b2a6b" stroke-width="3"/>
  <polygon points="620,120 850,70 1080,120" fill="#c8102e"/>
  <!-- gutter + downspout extended -->
  <rect x="1040" y="118" width="16" height="120" fill="#2d55b0"/>
  <rect x="1040" y="230" width="120" height="14" fill="#2d55b0"/>
  <text x="1040" y="270" font-size="15" fill="#1b2a6b">Downspout &gt;6 ft away</text>
  <!-- grading slope -->
  <polygon points="640,220 640,250 400,300 400,260" fill="#b89b78"/>
  <text x="410" y="245" font-size="15" fill="#1b2a6b">Graded soil slopes away</text>
  <!-- foundation wall -->
  <rect x="640" y="220" width="420" height="400" fill="#cfd8e6" stroke="#1b2a6b" stroke-width="3"/>
  <text x="850" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#1b2a6b">BASEMENT</text>
  <!-- excavation void -->
  <polygon points="560,220 640,220 640,600 560,600 500,420" fill="#cdb893"/>
  <!-- membrane + dimple board -->
  <rect x="620" y="220" width="20" height="400" fill="#1f8a4c"/>
  <rect x="604" y="220" width="14" height="400" fill="#0f1b47"/>
  <text x="250" y="360" font-size="20" font-weight="700" fill="#1b2a6b">Waterproof membrane</text>
  <text x="250" y="386" font-size="18" fill="#5a6b7b">+ dimple board</text>
  <line x1="470" y1="370" x2="600" y2="400" stroke="#1f8a4c" stroke-width="3"/>
  <!-- footing + exterior french drain -->
  <rect x="560" y="600" width="120" height="40" fill="#9fb0c8"/>
  <circle cx="590" cy="620" r="16" fill="#2d55b0" stroke="#fff" stroke-width="3"/>
  <circle cx="590" cy="620" r="5" fill="#fff"/>
  <text x="250" y="600" font-size="20" font-weight="700" fill="#1b2a6b">Exterior French drain</text>
  <text x="250" y="626" font-size="18" fill="#5a6b7b">in gravel at the footing</text>
  <line x1="470" y1="612" x2="572" y2="618" stroke="#2d55b0" stroke-width="3"/>
  <!-- gravel dots -->
  <g fill="#a89576">
    <circle cx="612" cy="600" r="4"/><circle cx="628" cy="612" r="4"/><circle cx="606" cy="624" r="4"/>
    <circle cx="624" cy="632" r="4"/><circle cx="640" cy="606" r="4"/>
  </g>
  <!-- water arrows downward -->
  <g stroke="#2d55b0" stroke-width="3" fill="none">
    <path d="M660,250 L660,560"/><path d="M650,545 L660,565 L670,545"/>
  </g>
</svg>
