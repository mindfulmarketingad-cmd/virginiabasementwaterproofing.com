<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Interior Drainage &amp; Sump Pump &#8212; Managing What Gets In</text>
  <!-- basement box -->
  <rect x="120" y="110" width="960" height="470" fill="#ffffff" stroke="#1b2a6b" stroke-width="4"/>
  <!-- floor slab -->
  <rect x="124" y="500" width="952" height="78" fill="#cfd8e6"/>
  <!-- left wall with vapor barrier -->
  <rect x="124" y="114" width="22" height="386" fill="#9fb0c8"/>
  <rect x="146" y="114" width="10" height="386" fill="#2d55b0"/>
  <text x="170" y="200" font-size="18" font-weight="700" fill="#1b2a6b">Vapor barrier</text>
  <text x="170" y="224" font-size="15" fill="#5a6b7b">directs seepage down</text>
  <!-- seepage arrows through wall -->
  <g stroke="#2d55b0" stroke-width="3" fill="none">
    <path d="M150,260 L150,470"/><path d="M142,455 L150,475 L158,455"/>
  </g>
  <!-- interior perimeter drain trench -->
  <rect x="146" y="470" width="900" height="30" fill="#a89576"/>
  <rect x="146" y="478" width="900" height="14" fill="#2d55b0"/>
  <g fill="#fff">
    <circle cx="220" cy="485" r="5"/><circle cx="320" cy="485" r="5"/><circle cx="420" cy="485" r="5"/>
    <circle cx="520" cy="485" r="5"/><circle cx="620" cy="485" r="5"/><circle cx="720" cy="485" r="5"/>
  </g>
  <text x="430" y="540" font-size="18" font-weight="700" fill="#1b2a6b">Perimeter drain tile (perforated pipe in gravel)</text>
  <!-- sump pit -->
  <rect x="880" y="470" width="120" height="110" fill="#0f1b47"/>
  <rect x="892" y="500" width="96" height="70" fill="#2d55b0" opacity="0.5"/>
  <!-- pump -->
  <rect x="915" y="505" width="50" height="55" fill="#1b2a6b"/>
  <rect x="934" y="430" width="12" height="80" fill="#1b2a6b"/>
  <text x="900" y="420" text-anchor="middle" font-size="16" font-weight="800" fill="#c8102e">Sump pump</text>
  <!-- discharge up and out -->
  <path d="M940,430 L940,160 L1140,160" stroke="#c8102e" stroke-width="8" fill="none"/>
  <polygon points="1120,148 1160,160 1120,172" fill="#c8102e"/>
  <text x="1000" y="145" font-size="16" font-weight="700" fill="#c8102e">Pumped out &amp; away</text>
  <!-- caption -->
  <text x="170" y="320" font-size="20" font-weight="700" fill="#1b2a6b">Water collected at the</text>
  <text x="170" y="346" font-size="20" font-weight="700" fill="#1b2a6b">perimeter feeds the pit,</text>
  <text x="170" y="372" font-size="20" font-weight="700" fill="#1b2a6b">then the pump ejects it.</text>
</svg>
