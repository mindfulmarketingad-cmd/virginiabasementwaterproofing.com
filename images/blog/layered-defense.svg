<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">A Layered Defense: How the Pieces Work Together</text>

  <!-- three stacked layers -->
  <!-- Layer 1 Exterior -->
  <rect x="60" y="100" width="1080" height="150" rx="12" fill="#eaeffa" stroke="#2d55b0" stroke-width="2"/>
  <circle cx="140" cy="175" r="40" fill="#2d55b0"/>
  <text x="140" y="188" text-anchor="middle" font-size="34" fill="#fff" font-weight="800">1</text>
  <text x="210" y="160" font-size="24" font-weight="800" fill="#1b2a6b">Exterior &#8212; Prevention</text>
  <text x="210" y="195" font-size="18" fill="#5a6b7b">Membranes, dimple board, exterior French drains, grading &amp; gutters</text>
  <text x="210" y="222" font-size="18" fill="#5a6b7b">stop water before it reaches the foundation.</text>

  <!-- Layer 2 Interior -->
  <rect x="60" y="265" width="1080" height="150" rx="12" fill="#eafaf0" stroke="#1f8a4c" stroke-width="2"/>
  <circle cx="140" cy="340" r="40" fill="#1f8a4c"/>
  <text x="140" y="353" text-anchor="middle" font-size="34" fill="#fff" font-weight="800">2</text>
  <text x="210" y="325" font-size="24" font-weight="800" fill="#1b2a6b">Interior &#8212; Management</text>
  <text x="210" y="360" font-size="18" fill="#5a6b7b">Perimeter drains, sump pumps, vapor barriers, sealants &amp; crack injection</text>
  <text x="210" y="387" font-size="18" fill="#5a6b7b">capture and remove water that still gets through.</text>

  <!-- Layer 3 Humidity -->
  <rect x="60" y="430" width="1080" height="150" rx="12" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
  <circle cx="140" cy="505" r="40" fill="#c8102e"/>
  <text x="140" y="518" text-anchor="middle" font-size="34" fill="#fff" font-weight="800">3</text>
  <text x="210" y="490" font-size="24" font-weight="800" fill="#1b2a6b">Humidity &#8212; Moisture Control</text>
  <text x="210" y="525" font-size="18" fill="#5a6b7b">A high-capacity dehumidifier holds relative humidity below the level</text>
  <text x="210" y="552" font-size="18" fill="#5a6b7b">mold needs to grow &#8212; protecting air quality and structure.</text>

  <text x="600" y="625" text-anchor="middle" font-size="18" font-style="italic" fill="#5a6b7b">Together these layers keep a basement dry in any season.</text>
</svg>
