<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Is It Structural? Identify the Crack First</text>

  <!-- Non-structural panel -->
  <rect x="50" y="100" width="540" height="520" rx="12" fill="#eafaf0" stroke="#1f8a4c" stroke-width="3"/>
  <text x="320" y="145" text-anchor="middle" font-size="24" font-weight="800" fill="#1f8a4c">Usually Non-Structural</text>
  <text x="320" y="172" text-anchor="middle" font-size="16" fill="#5a6b7b">Often DIY-friendly &#8212; seal against water</text>

  <!-- vertical crack wall sample -->
  <rect x="90" y="200" width="220" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M200,205 L196,300 L205,400 L198,575" stroke="#1b2a6b" stroke-width="4" fill="none"/>
  <text x="200" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a6b">Vertical / diagonal</text>

  <!-- hairline + floor shrinkage -->
  <rect x="340" y="200" width="220" height="180" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M360,240 L540,250" stroke="#1b2a6b" stroke-width="2" fill="none"/>
  <path d="M370,300 L530,290" stroke="#1b2a6b" stroke-width="2" fill="none"/>
  <text x="450" y="405" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a6b">Hairline / shrinkage</text>
  <text x="450" y="470" text-anchor="middle" font-size="15" fill="#5a6b7b">Width under</text>
  <text x="450" y="494" text-anchor="middle" font-size="34" font-weight="800" fill="#1f8a4c">&lt; 1/4"</text>

  <!-- Structural panel -->
  <rect x="610" y="100" width="540" height="520" rx="12" fill="#fdeef0" stroke="#c8102e" stroke-width="3"/>
  <text x="880" y="145" text-anchor="middle" font-size="24" font-weight="800" fill="#c8102e">Likely Structural</text>
  <text x="880" y="172" text-anchor="middle" font-size="16" fill="#5a6b7b">Call a pro before patching</text>

  <!-- stair-step block crack -->
  <rect x="650" y="200" width="220" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <g stroke="#1b2a6b" stroke-width="5" fill="none">
    <path d="M680,560 L730,560 L730,500 L780,500 L780,440 L830,440 L830,380"/>
  </g>
  <text x="760" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a6b">Stair-step</text>

  <!-- horizontal crack -->
  <rect x="900" y="200" width="220" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M910,380 L1110,386" stroke="#c8102e" stroke-width="7" fill="none"/>
  <text x="1010" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a6b">Horizontal</text>
  <text x="1010" y="470" text-anchor="middle" font-size="15" fill="#5a6b7b">or width over</text>
  <text x="1010" y="500" text-anchor="middle" font-size="34" font-weight="800" fill="#c8102e">1/4"+</text>
</svg>
