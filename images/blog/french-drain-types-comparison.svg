<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="26" font-weight="800" fill="#ffffff">Four Jobs, One Idea: Pipe in Gravel, Sloped Downhill</text>

  <!-- 4 columns -->
  <!-- 1: Exterior perimeter -->
  <rect x="50" y="90" width="260" height="540" rx="10" fill="#eaeffa" stroke="#2d55b0" stroke-width="2"/>
  <text x="180" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Exterior</text>
  <text x="180" y="146" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Perimeter Drain</text>
  <rect x="70" y="170" width="220" height="140" fill="#fff" stroke="#5a6b7b" stroke-dasharray="4 3"/>
  <rect x="90" y="230" width="180" height="60" fill="#d8d2c4"/>
  <circle cx="180" cy="270" r="16" fill="#2d55b0"/>
  <text x="180" y="335" text-anchor="middle" font-size="14" fill="#5a6b7b">Runs along the foundation</text>
  <text x="180" y="355" text-anchor="middle" font-size="14" fill="#5a6b7b">footing, outside the wall</text>
  <text x="180" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">Stops water before</text>
  <text x="180" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">it reaches the wall</text>
  <text x="180" y="450" text-anchor="middle" font-size="13" fill="#5a6b7b">Best for: chronic wall</text>
  <text x="180" y="468" text-anchor="middle" font-size="13" fill="#5a6b7b">seepage, new construction</text>

  <!-- 2: Interior drain tile -->
  <rect x="320" y="90" width="260" height="540" rx="10" fill="#eafaf0" stroke="#1f8a4c" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Interior</text>
  <text x="450" y="146" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Drain Tile</text>
  <rect x="340" y="170" width="220" height="140" fill="#fff" stroke="#5a6b7b" stroke-dasharray="4 3"/>
  <rect x="360" y="240" width="180" height="50" fill="#d8d2c4"/>
  <circle cx="450" cy="265" r="14" fill="#1f8a4c"/>
  <circle cx="530" cy="290" r="18" fill="#1f8a4c"/>
  <text x="450" y="335" text-anchor="middle" font-size="14" fill="#5a6b7b">Cut into the basement</text>
  <text x="450" y="355" text-anchor="middle" font-size="14" fill="#5a6b7b">floor, feeds a sump pump</text>
  <text x="450" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">Manages water that</text>
  <text x="450" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">already got through</text>
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#5a6b7b">Best for: existing homes,</text>
  <text x="450" y="468" text-anchor="middle" font-size="13" fill="#5a6b7b">less invasive retrofit</text>

  <!-- 3: Curtain / yard drain -->
  <rect x="590" y="90" width="260" height="540" rx="10" fill="#fdeef0" stroke="#c8102e" stroke-width="2"/>
  <text x="720" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Curtain /</text>
  <text x="720" y="146" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Yard Drain</text>
  <path d="M630 250 L 780 210" stroke="#7a9b5c" stroke-width="18" stroke-linecap="round"/>
  <rect x="620" y="255" width="180" height="40" fill="#d8d2c4"/>
  <circle cx="710" cy="275" r="14" fill="#c8102e"/>
  <text x="720" y="335" text-anchor="middle" font-size="14" fill="#5a6b7b">Cuts across a slope,</text>
  <text x="720" y="355" text-anchor="middle" font-size="14" fill="#5a6b7b">upslope of the problem</text>
  <text x="720" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">Intercepts surface</text>
  <text x="720" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">water in the yard</text>
  <text x="720" y="450" text-anchor="middle" font-size="13" fill="#5a6b7b">Best for: soggy lawns,</text>
  <text x="720" y="468" text-anchor="middle" font-size="13" fill="#5a6b7b">water crossing your property</text>

  <!-- 4: Dry well tie-in -->
  <rect x="860" y="90" width="260" height="540" rx="10" fill="#f5f0fa" stroke="#7b4fa0" stroke-width="2"/>
  <text x="990" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Dry Well</text>
  <text x="990" y="146" text-anchor="middle" font-size="19" font-weight="800" fill="#1b2a6b">Discharge</text>
  <rect x="890" y="200" width="200" height="90" fill="#fff" stroke="#5a6b7b" stroke-dasharray="4 3"/>
  <circle cx="990" cy="245" r="34" fill="#e4d9ef" stroke="#7b4fa0" stroke-width="2"/>
  <circle cx="975" cy="235" r="4" fill="#a8a190"/><circle cx="1000" cy="250" r="5" fill="#a8a190"/>
  <circle cx="985" cy="258" r="4" fill="#a8a190"/><circle cx="1005" cy="232" r="4" fill="#a8a190"/>
  <text x="990" y="335" text-anchor="middle" font-size="14" fill="#5a6b7b">A gravel-filled pit the</text>
  <text x="990" y="355" text-anchor="middle" font-size="14" fill="#5a6b7b">drain empties into</text>
  <text x="990" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">Lets water soak in</text>
  <text x="990" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2a6b">when there's no slope left</text>
  <text x="990" y="450" text-anchor="middle" font-size="13" fill="#5a6b7b">Best for: flat lots with</text>
  <text x="990" y="468" text-anchor="middle" font-size="13" fill="#5a6b7b">nowhere downhill to daylight</text>

  <text x="600" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a6b">Every version is the same core idea &#8212; a perforated pipe in gravel, sloped to move water somewhere useful.</text>
</svg>
