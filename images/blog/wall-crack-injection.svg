<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Repairing a Wall Crack: Injection in 4 Steps</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="270" height="520" rx="12" fill="#f5f7fc" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="80" cy="140" r="22" fill="#2d55b0"/><text x="80" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
  <text x="115" y="147" font-size="20" font-weight="800" fill="#1b2a6b">Prep</text>
  <rect x="90" y="190" width="170" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M175,200 L170,360 L178,560" stroke="#1b2a6b" stroke-width="6" fill="none"/>
  <text x="65" y="600" font-size="15" fill="#5a6b7b">Wire-brush &amp; widen the crack.</text>

  <!-- Step 2 -->
  <rect x="325" y="100" width="270" height="520" rx="12" fill="#f5f7fc" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="365" cy="140" r="22" fill="#2d55b0"/><text x="365" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
  <text x="400" y="147" font-size="20" font-weight="800" fill="#1b2a6b">Ports</text>
  <rect x="375" y="190" width="170" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M460,200 L455,360 L463,560" stroke="#0f1b47" stroke-width="8" fill="none"/>
  <g fill="#c8102e"><rect x="448" y="240" width="24" height="18"/><rect x="448" y="330" width="24" height="18"/><rect x="448" y="420" width="24" height="18"/><rect x="448" y="510" width="24" height="18"/></g>
  <text x="350" y="600" font-size="15" fill="#5a6b7b">Ports every 8&#8211;10"; seal face.</text>

  <!-- Step 3 -->
  <rect x="610" y="100" width="270" height="520" rx="12" fill="#f5f7fc" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="650" cy="140" r="22" fill="#2d55b0"/><text x="650" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
  <text x="685" y="147" font-size="20" font-weight="800" fill="#1b2a6b">Inject</text>
  <rect x="660" y="190" width="170" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M745,200 L740,360 L748,560" stroke="#0f1b47" stroke-width="8" fill="none"/>
  <g fill="#c8102e"><rect x="733" y="240" width="24" height="18"/><rect x="733" y="330" width="24" height="18"/><rect x="733" y="420" width="24" height="18"/></g>
  <rect x="733" y="510" width="24" height="18" fill="#1f8a4c"/>
  <!-- caulk gun arrow at lowest -->
  <path d="M690,519 L731,519" stroke="#1b2a6b" stroke-width="5"/>
  <polygon points="724,510 745,519 724,528" fill="#1b2a6b"/>
  <text x="635" y="600" font-size="15" fill="#5a6b7b">Inject low to high until it oozes.</text>

  <!-- Step 4 -->
  <rect x="895" y="100" width="265" height="520" rx="12" fill="#f5f7fc" stroke="#e3e8ee" stroke-width="2"/>
  <circle cx="935" cy="140" r="22" fill="#1f8a4c"/><text x="935" y="149" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
  <text x="970" y="147" font-size="20" font-weight="800" fill="#1b2a6b">Finish</text>
  <rect x="945" y="190" width="170" height="380" fill="#cfd8e6" stroke="#9fb0c8" stroke-width="2"/>
  <path d="M1030,200 L1025,360 L1033,560" stroke="#1f8a4c" stroke-width="6" fill="none"/>
  <text x="918" y="600" font-size="15" fill="#5a6b7b">Cure 24&#8211;48h; grind ports flush.</text>
</svg>
