<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#f5f7fc"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">Repairing a Floor Crack: The Dovetail Method</text>

  <!-- Step A: dovetail cross-section -->
  <rect x="50" y="100" width="540" height="520" rx="12" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2a6b">1. Cut a "dovetail" channel</text>
  <!-- slab -->
  <rect x="100" y="200" width="440" height="320" fill="#cfd8e6"/>
  <!-- dovetail groove: wider at bottom -->
  <polygon points="290,200 350,200 380,360 260,360" fill="#ffffff" stroke="#1b2a6b" stroke-width="3"/>
  <text x="600" y="0" font-size="1" fill="#fff"> </text>
  <text x="120" y="250" font-size="16" fill="#5a6b7b">Top: narrow</text>
  <text x="120" y="350" font-size="16" fill="#5a6b7b">Bottom: wider &#8212; locks the patch in</text>
  <!-- arrows -->
  <path d="M250,210 L290,210" stroke="#c8102e" stroke-width="3"/><polygon points="285,205 296,210 285,215" fill="#c8102e"/>
  <path d="M390,210 L350,210" stroke="#c8102e" stroke-width="3"/><polygon points="355,205 344,210 355,215" fill="#c8102e"/>
  <text x="120" y="480" font-size="16" fill="#5a6b7b">Vacuum dust, then dampen the channel.</text>

  <!-- Step B: packed patch -->
  <rect x="610" y="100" width="540" height="520" rx="12" fill="#ffffff" stroke="#e3e8ee" stroke-width="2"/>
  <text x="880" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2a6b">2. Pack &amp; smooth the patch</text>
  <rect x="660" y="200" width="440" height="320" fill="#cfd8e6"/>
  <!-- filled dovetail -->
  <polygon points="850,200 910,200 940,360 820,360" fill="#1f8a4c" stroke="#0f1b47" stroke-width="2"/>
  <!-- trowel -->
  <rect x="780" y="170" width="220" height="16" rx="4" fill="#1b2a6b"/>
  <rect x="870" y="150" width="40" height="24" rx="4" fill="#5a6b7b"/>
  <text x="660" y="430" font-size="16" fill="#5a6b7b">Press hydraulic cement or acrylic patch</text>
  <text x="660" y="456" font-size="16" fill="#5a6b7b">deep into the crack; pack out air pockets.</text>
  <text x="660" y="486" font-size="16" fill="#5a6b7b">Trowel level &amp; feather into the floor.</text>
  <rect x="660" y="540" width="440" height="40" rx="6" fill="#1f8a4c"/>
  <text x="880" y="566" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Cures for light foot traffic in ~2&#8211;3 hours</text>
</svg>
