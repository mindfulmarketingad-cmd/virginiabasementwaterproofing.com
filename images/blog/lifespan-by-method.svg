<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="64" fill="#1b2a6b"/>
  <text x="40" y="42" font-size="28" font-weight="800" fill="#ffffff">Waterproofing Lifespan by Method</text>
  <!-- axis -->
  <line x1="430" y1="110" x2="430" y2="600" stroke="#e3e8ee" stroke-width="2"/>
  <line x1="700" y1="110" x2="700" y2="600" stroke="#e3e8ee" stroke-width="2"/>
  <line x1="970" y1="110" x2="970" y2="600" stroke="#e3e8ee" stroke-width="2"/>
  <text x="430" y="635" text-anchor="middle" font-size="16" fill="#5a6b7b">10 yrs</text>
  <text x="700" y="635" text-anchor="middle" font-size="16" fill="#5a6b7b">25 yrs</text>
  <text x="970" y="635" text-anchor="middle" font-size="16" fill="#5a6b7b">40 yrs</text>

  <!-- rows: label x=40, bar starts x=300, scale ~ 18px/yr from x=300(0yr) -->
  <!-- Interior drain 50 -->
  <text x="40" y="150" font-size="19" font-weight="700" fill="#1b2a6b">Interior drainage</text>
  <rect x="300" y="128" width="612" height="30" rx="4" fill="#1f8a4c"/>
  <text x="922" y="150" font-size="16" fill="#5a6b7b">20–50 yrs</text>

  <!-- Exterior membrane 30 -->
  <text x="40" y="210" font-size="19" font-weight="700" fill="#1b2a6b">Exterior membrane</text>
  <rect x="300" y="188" width="486" height="30" rx="4" fill="#2d55b0"/>
  <text x="796" y="210" font-size="16" fill="#5a6b7b">20–30+ yrs</text>

  <!-- Crack injection (permanent) -->
  <text x="40" y="270" font-size="19" font-weight="700" fill="#1b2a6b">Crack injection</text>
  <rect x="300" y="248" width="612" height="30" rx="4" fill="#1b2a6b"/>
  <text x="922" y="270" font-size="16" fill="#5a6b7b">Permanent*</text>

  <!-- Vapor barrier 20 -->
  <text x="40" y="330" font-size="19" font-weight="700" fill="#1b2a6b">Vapor barrier</text>
  <rect x="300" y="308" width="360" height="30" rx="4" fill="#2d55b0"/>
  <text x="670" y="330" font-size="16" fill="#5a6b7b">15–20+ yrs</text>

  <!-- Sump pump 12 -->
  <text x="40" y="390" font-size="19" font-weight="700" fill="#1b2a6b">Sump pump</text>
  <rect x="300" y="368" width="216" height="30" rx="4" fill="#c8102e"/>
  <text x="526" y="390" font-size="16" fill="#5a6b7b">7–12 yrs</text>

  <!-- Dehumidifier 10 -->
  <text x="40" y="450" font-size="19" font-weight="700" fill="#1b2a6b">Dehumidifier</text>
  <rect x="300" y="428" width="180" height="30" rx="4" fill="#c8102e"/>
  <text x="490" y="450" font-size="16" fill="#5a6b7b">5–10 yrs</text>

  <!-- Masonry paint 10 -->
  <text x="40" y="510" font-size="19" font-weight="700" fill="#1b2a6b">Interior masonry paint</text>
  <rect x="300" y="488" width="180" height="30" rx="4" fill="#c8102e"/>
  <text x="490" y="510" font-size="16" fill="#5a6b7b">5–10 yrs</text>

  <!-- legend -->
  <rect x="300" y="556" width="18" height="18" fill="#1f8a4c"/><text x="326" y="571" font-size="15" fill="#5a6b7b">Major systems</text>
  <rect x="470" y="556" width="18" height="18" fill="#c8102e"/><text x="496" y="571" font-size="15" fill="#5a6b7b">Wear components</text>
  <text x="40" y="600" font-size="13" fill="#5a6b7b">*Lasts as long as the foundation stays stable.</text>
</svg>
