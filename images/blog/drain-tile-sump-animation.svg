<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2d55b0"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#eaeffa"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1b2a6b"/>
  <text x="40" y="40" font-size="28" font-weight="800" fill="#ffffff">How Interior Drain Tile Feeds the Sump Pump</text>

  <!-- soil -->
  <rect y="120" width="1200" height="555" fill="#d9c3a6"/>
  <!-- basement interior -->
  <rect x="160" y="160" width="880" height="420" fill="#ffffff" stroke="#1b2a6b" stroke-width="4"/>
  <rect x="164" y="500" width="872" height="80" fill="#cfd8e6"/>
  <text x="600" y="330" text-anchor="middle" font-size="26" font-weight="800" fill="#1b2a6b" opacity="0.5">BASEMENT</text>

  <!-- wall seepage arrows (numbered 1) -->
  <g stroke="#2d55b0" stroke-width="3" fill="none" marker-end="url(#ah)">
    <path d="M180,250 L210,300"/>
    <path d="M1020,250 L990,300"/>
  </g>
  <circle cx="230" cy="250" r="16" fill="#2d55b0"/><text x="230" y="256" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text>
  <text x="250" y="245" font-size="15" fill="#1b2a6b">Water seeps in at walls/floor joint</text>

  <!-- drain tile around perimeter under slab (2) -->
  <rect x="180" y="500" width="840" height="26" fill="#a89576"/>
  <rect x="180" y="508" width="840" height="12" fill="#2d55b0"/>
  <g fill="#fff"><circle cx="260" cy="514" r="5"/><circle cx="360" cy="514" r="5"/><circle cx="460" cy="514" r="5"/><circle cx="560" cy="514" r="5"/><circle cx="660" cy="514" r="5"/><circle cx="760" cy="514" r="5"/><circle cx="860" cy="514" r="5"/></g>
  <circle cx="300" cy="470" r="16" fill="#2d55b0"/><text x="300" y="476" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text>
  <text x="324" y="476" font-size="15" fill="#1b2a6b">Perforated drain tile collects it in gravel</text>

  <!-- flow toward pit (arrows along pipe) -->
  <g stroke="#2d55b0" stroke-width="4" fill="none" marker-end="url(#ah)">
    <path d="M520,514 L900,514"/>
  </g>

  <!-- sump pit (3) -->
  <rect x="900" y="500" width="120" height="80" fill="#0f1b47"/>
  <rect x="912" y="520" width="96" height="55" fill="#2d55b0" opacity="0.5"/>
  <rect x="935" y="525" width="50" height="50" fill="#1b2a6b"/>
  <rect x="954" y="450" width="12" height="80" fill="#1b2a6b"/>
  <circle cx="960" cy="430" r="16" fill="#c8102e"/><text x="960" y="436" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text>
  <text x="760" y="430" font-size="15" fill="#1b2a6b">Pit fills; pump switches on</text>

  <!-- discharge out (4) -->
  <path d="M960,450 L960,180 L1160,180" stroke="#c8102e" stroke-width="8" fill="none"/>
  <polygon points="1140,168 1180,180 1140,192" fill="#c8102e"/>
  <circle cx="1080" cy="150" r="16" fill="#c8102e"/><text x="1080" y="156" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text>
  <text x="1000" y="150" font-size="15" font-weight="700" fill="#c8102e">Pumped away</text>
</svg>
